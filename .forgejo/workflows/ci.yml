name: CI

# Runs in a disposable VM on the estate's CI host. Since 2026-11-15 Alethic's
# canonical repository is on our own (private) Forgejo, which mirrors every
# push to github.com/emiluzelac/alethic, the public face, where a v* tag
# publishes to PyPI (.github/workflows/publish.yml, trusted publishing). These
# are the same checks as GitHub's CI. The Python images carry no Node for
# actions/checkout, so each job checks out with git and its own token.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test and Type Check (${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            image: python:3.11-bookworm@sha256:726d304906fa5eb468e5531e366548d1903286352f5adb54ef508ac01fbd80c6
          - python-version: '3.12'
            image: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    container: ${{ matrix.image }}
    steps:
      - name: Check out
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git -c "http.extraHeader=Authorization: token $CHECKOUT_TOKEN" \
            fetch -q --depth 1 "$SERVER/$REPOSITORY.git" "$COMMIT"
          git checkout -q --detach FETCH_HEAD

      - name: The container's Python is the matrix's
        run: python -c 'import sys; assert "%d.%d" % sys.version_info[:2] == "${{ matrix.python-version }}", sys.version'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run type checking (mypy)
        run: mypy --strict src

      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel contains one namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          runtime = [name for name in names if ".dist-info/" not in name]
          assert runtime
          assert all(name.startswith("alethic/") for name in runtime), runtime
          assert not any(name.startswith("alethic_kernel/") for name in names)
          PY
