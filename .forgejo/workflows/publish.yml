name: Publish to PyPI

# Publishes a version tag. Alethic's canonical repository is on our own
# Forgejo (since 2026-11-15), and so is its publishing: pushing a v* tag whose
# version matches pyproject.toml runs this workflow in a disposable VM. It
# tests, builds and checks the distributions, uploads them to PyPI with the
# repository secret PYPI_API_TOKEN, and creates the Forgejo release with the
# CHANGELOG.md section as its notes and the distributions attached. GitHub's
# copy is a push mirror and publishes nothing (PyPI's trusted publisher for
# GitHub stays registered but unused).
#
# Run it by hand (workflow_dispatch) to publish an existing tag again; PyPI
# skips files it has. With `publish` off it tests and builds only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, e.g. v0.4.0
        required: true
      publish:
        description: Publish (off = test and build only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    timeout-minutes: 30
    container: python:3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      # The Python image carries no Node for actions/checkout.
      - name: Check out the tag
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git -c "http.extraHeader=Authorization: token $CHECKOUT_TOKEN" \
            fetch -q --depth 1 "$SERVER/$REPOSITORY.git" "refs/tags/$TAG"
          git checkout -q --detach FETCH_HEAD

      - name: The tag matches pyproject.toml
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"tag {tag} does not match pyproject.toml version {version}"
          PY

      - name: Test and type-check
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -e ".[dev]"
          pytest tests/ -q --tb=short
          mypy --strict src

      - name: Build distributions
        run: |
          pip install -q build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel contains one namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          runtime = [name for name in names if ".dist-info/" not in name]
          assert runtime
          assert all(name.startswith("alethic/") for name in runtime), runtime
          assert not any(name.startswith("alethic_kernel/") for name in names)
          PY

      - name: Upload to PyPI
        if: env.PUBLISH == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: python -m twine upload --skip-existing dist/*

      - name: The Forgejo release, with the distributions
        if: env.PUBLISH == 'true'
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request, uuid
          from pathlib import Path

          api, token, tag = os.environ["FORGEJO_API"], os.environ["FORGEJO_TOKEN"], os.environ["TAG"]

          def call(method, path, body=None, ctype="application/json"):
              data = body if isinstance(body, bytes) or body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, method=method,
                                           headers={"Authorization": f"token {token}", "Accept": "application/json", "Content-Type": ctype})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code, None

          version = tag[1:]
          text = Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else f"Release {tag}.") + f"\n\nhttps://pypi.org/project/alethic-kernel/{version}/"

          status, rel = call("GET", f"/releases/tags/{tag}")
          if status == 404:
              status, rel = call("POST", "/releases", {"tag_name": tag, "name": tag, "body": notes})
              assert status == 201, f"creating the release answered {status}"
              print(f"created release {tag}")
          else:
              assert status == 200, f"reading the release answered {status}"
          have = {a["name"] for a in rel.get("assets") or []}
          for f in sorted(Path("dist").iterdir()):
              if f.name in have:
                  print(f"{f.name} is attached already")
                  continue
              boundary = uuid.uuid4().hex
              body = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"attachment\"; filename=\"{f.name}\"\r\n"
                      f"Content-Type: application/octet-stream\r\n\r\n").encode() + f.read_bytes() + f"\r\n--{boundary}--\r\n".encode()
              status, _ = call("POST", f"/releases/{rel['id']}/assets?name={f.name}", body, f"multipart/form-data; boundary={boundary}")
              assert status == 201, f"attaching {f.name} answered {status}"
              print(f"attached {f.name}")
          PY
