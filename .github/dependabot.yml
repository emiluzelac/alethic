version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      weekly-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      weekly-updates:
        applies-to: version-updates
        patterns: ["*"]
